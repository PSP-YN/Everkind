name: Everkind quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://accessibility-test.supabase.co
      VITE_SUPABASE_ANON_KEY: public-test-key-for-mocked-browser-tests
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint source and tests
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Install Chromium for accessibility tests
        run: npx playwright install --with-deps chromium
      - name: Run WCAG 2.1 AA accessibility suite
        run: npm run test:a11y
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
